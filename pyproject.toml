[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-counting"
version = "0.2.0"
description = "Подсчет транспортных средств в видеопотоке: YOLO11 + BoT-SORT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.scripts]
vehicle-counting = "vehicle_counting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
